<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <img src="assets/images/headerMiEspacio.jpeg" alt="Logo">
            <h1>Crea tu cuenta</h1>
            <p>Únete a nuestra comunidad de arquitectura.</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" formControlName="name" placeholder="Juan Pérez">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" placeholder="••••••••">
            </div>

            <div *ngIf="errorMsg" class="error-alert">
                {{ errorMsg }}
            </div>

            <button type="submit" [disabled]="registerForm.invalid || loading" class="btn btn-primary btn-submit">
                {{ loading ? 'Creando cuenta...' : 'Registrarse' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a></p>
        </div>
    </div>
</div>
