<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <img src="assets/images/headerMiEspacio.jpeg" alt="Logo">
            <h1>Bienvenido de nuevo</h1>
            <p>Ingresa tus credenciales para acceder a tu panel.</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
                <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error-hint">
                    Por favor, ingresa un correo válido.
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" placeholder="••••••••">
                <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                    class="error-hint">
                    La contraseña debe tener al menos 6 caracteres.
                </div>
            </div>

            <div class="form-options">
                <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <div *ngIf="errorMsg" class="error-alert">
                {{ errorMsg }}
            </div>

            <button type="submit" [disabled]="loginForm.invalid || loading" class="btn btn-primary btn-submit">
                {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
        </div>
    </div>
</div>
