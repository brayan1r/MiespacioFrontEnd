<app-header></app-header>

<section class="ourjob-header">
  <div class="container-px">
    <h1>Nuestras <span class="accent">Obras</span></h1>
    <p>Explora nuestra trayectoria a través de proyectos que definen la arquitectura contemporánea.</p>
  </div>
</section>

<section class="portfolio container-px section-spacing">
  <div class="filter-bar">
    <button *ngFor="let cat of categories" 
            [class.active]="activeCategory === cat"
            (click)="setCategory(cat)">
      {{ cat }}
    </button>
  </div>

  <div class="projects-grid" [class.loading]="loading">
    <div class="project-card" *ngFor="let project of filteredProjects">
      <div class="project-image">
        <img [src]="project.image" [alt]="project.title">
        <div class="project-overlay">
          <div class="project-category">{{ project.category }}</div>
          <h3>{{ project.title }}</h3>
          <div class="project-actions">
            <button class="btn btn-light btn-sm">Ver Proyecto</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="cta-banner container-px">
  <div class="banner-inner">
    <h2>¿Tienes un terreno o idea?</h2>
    <p>Permítenos ayudarte a conceptualizar y construir el espacio de tus sueños.</p>
    <a routerLink="/quotation" class="btn btn-light">Iniciar Cotización</a>
  </div>
</section>

</main>

<app-footer></app-footer>
