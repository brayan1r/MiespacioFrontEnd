<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <img src="assets/images/headerMiEspacio.jpeg" alt="Logo">
            <h1>Recuperar Contraseña</h1>
            <p>Ingresa tu correo y te enviaremos las instrucciones.</p>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
                <div *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" class="error-hint">
                    Por favor, ingresa un correo válido.
                </div>
            </div>

            <div *ngIf="errorMsg" class="error-alert">
                {{ errorMsg }}
            </div>

            <div *ngIf="message" class="success-alert">
                {{ message }}
            </div>

            <button type="submit" [disabled]="forgotForm.invalid || loading" class="btn btn-primary btn-submit">
                {{ loading ? 'Enviando...' : 'Enviar Instrucciones' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>¿Recordaste tu contraseña? <a routerLink="/login">Inicia sesión</a></p>
        </div>
    </div>
</div>
